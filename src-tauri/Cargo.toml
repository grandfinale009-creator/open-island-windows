[package]
name = "open-island"
version = "0.1.0"
edition = "2021"
description = "Windows Dynamic Island for AI coding agents - monitor sessions, approve permissions, jump to terminal"
license = "GPL-3.0-only"
repository = ""
authors = ["Open Island Contributors"]

[lib]
name = "open_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-island"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
winreg = "0.55"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Console",
    "Win32_Foundation",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
